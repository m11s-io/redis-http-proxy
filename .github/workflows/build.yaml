name: Build and push

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      skip_push:
        description: 'Dry-run: build without pushing to Docker Hub'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

  build:
    timeout-minutes: 30
    runs-on: ubuntu-26.04
    needs: test
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve image tags
        id: tags
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          publish=false
          release=false
          if [[ "$EVENT_NAME" == "push" && "$REF" =~ ^refs/tags/v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
            publish=true
            release=true
            {
              echo "tags<<EOF"
              printf '%s\n' "m11s/redis-http-proxy:${version}" "m11s/redis-http-proxy:latest" "m11s/redis-http-proxy:sha-${SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [[ "$REF" == "refs/heads/main" && ( "$EVENT_NAME" == "push" || "$EVENT_NAME" == "workflow_dispatch" ) ]]; then
            publish=true
            echo "tags=m11s/redis-http-proxy:sha-${SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=m11s/redis-http-proxy:ci-${SHA}" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        if: ${{ steps.tags.outputs.publish == 'true' && inputs.skip_push != true }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: ${{ steps.tags.outputs.publish == 'true' && inputs.skip_push != true }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub repository overview
        if: ${{ steps.tags.outputs.release == 'true' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: m11s/redis-http-proxy
          short-description: Bearer-token-authenticated HTTP proxy for Redis.
          readme-filepath: ./README.md
          enable-url-completion: true
